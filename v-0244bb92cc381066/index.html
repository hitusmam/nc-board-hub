<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>인스타 6채널 + 네이버클립 올인원 원클릭 보드</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #0B1120; color: #F8FAFC; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; line-height: 1.5; min-height: 100vh; }
    /* PIN Lock Screen */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 400px; background: linear-gradient(160deg, #111827 0%, #1E293B 100%); border: 1.5px solid #334155; border-radius: 22px; padding: 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.55); text-align: center; }
    .auth-icon { font-size: 36px; margin-bottom: 6px; }
    .auth-card h1 { margin: 0 0 6px; font-size: 19.5px; color: #12FA7A; }
    .auth-sub { font-size: 13px; color: #94A3B8; margin-bottom: 18px; }
    .pin-input { width: 100%; background: #0F172A; color: #F8FAFC; border: 2px solid #475569; border-radius: 14px; padding: 14px; font-size: 26px; font-weight: 900; letter-spacing: 10px; text-align: center; outline: none; transition: border-color 0.15s; }
    .pin-input:focus { border-color: #12FA7A; }
    .pin-input:disabled { opacity: 0.45; cursor: not-allowed; border-color: #EF4444; }
    .remember-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 14px; font-size: 13px; color: #CBD5E1; cursor: pointer; user-select: none; }
    .remember-row input { width: 17px; height: 17px; accent-color: #12FA7A; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 12px; }
    .kp-btn { background: #1E293B; color: #F8FAFC; border: 1px solid #334155; border-radius: 13px; padding: 14px 0; font-size: 20px; font-weight: 800; cursor: pointer; user-select: none; }
    .kp-btn:active { background: #334155; transform: scale(0.97); }
    .kp-btn.kp-ok { background: #12FA7A; color: #052E16; border-color: #10B981; font-size: 16px; }
    .kp-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .auth-msg { min-height: 22px; font-size: 13px; font-weight: 700; color: #F87171; margin-top: 6px; line-height: 1.45; }
    .auth-msg.locked { background: #450A0A; border: 1px solid #EF4444; color: #FCA5A5; padding: 10px 12px; border-radius: 11px; margin-top: 10px; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    .shake { animation: shake 0.25s ease; }

    /* Unlocked App */
    #app-view { display: none; padding: 14px 13px 80px; max-width: 1180px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 13px 16px; margin-bottom: 12px; }
    .topbar-title { font-size: 17px; font-weight: 900; color: #12FA7A; }
    .topbar-meta { font-size: 12px; color: #94A3B8; }
    .btn-lock { background: #1E293B; color: #FCA5A5; border: 1px solid #475569; border-radius: 10px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

    /* Channel Filter Chips */
    .filter-bar { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 11px 14px; margin-bottom: 12px; }
    .filter-lbl { font-size: 12px; color: #94A3B8; font-weight: 700; margin-bottom: 7px; display: block; }
    .ch-chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .ch-chip { flex: 0 0 auto; background: #0F172A; color: #E2E8F0; border: 1px solid #334155; border-radius: 99px; padding: 7px 13px; font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .ch-chip.active { background: #38BDF8; color: #082F49; border-color: #7DD3FC; font-weight: 900; }
    .ch-chip.nc-chip.active { background: #12FA7A; color: #052E16; border-color: #86EFAC; }

    /* Episode Selector & Platform View Tabs */
    .ep-bar { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
    .ep-bar-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .ep-select { flex: 1 1 260px; background: #0F172A; color: #FDE047; border: 1.5px solid #475569; border-radius: 10px; padding: 9px 12px; font-size: 14.5px; font-weight: 800; max-width: 100%; }
    .view-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .v-tab { background: #1E293B; color: #CBD5E1; border: 1px solid #475569; border-radius: 10px; padding: 7px 12px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .v-tab.active { background: #FACC15; color: #1E1B04; border-color: #FDE047; font-weight: 900; }
    .ep-pills { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .ep-pill { flex: 0 0 auto; background: #1E293B; color: #CBD5E1; border: 1px solid #334155; border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .ep-pill.active { background: #F472B6; color: #3B0764; border-color: #F9A8D4; font-weight: 900; }

    /* Instagram Section */
    .ig-section { background: linear-gradient(155deg, #1F122B 0%, #111827 100%); border: 2px solid #EC4899; border-radius: 18px; padding: 18px; margin-bottom: 18px; box-shadow: 0 10px 28px rgba(236,72,153,0.12); }
    .ig-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .ig-head h2 { margin: 0; font-size: 19px; color: #F9A8D4; }
    .ig-badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .ig-b { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
    .ig-b-acc { background: #831843; color: #FBCFE8; border: 1px solid #EC4899; }
    .ig-b-kw { background: #422006; color: #FDE047; border: 1px solid #F59E0B; }
    .ig-b-on { background: #064E3B; color: #6EE7B7; border: 1px solid #10B981; }
    .ig-b-wait { background: #334155; color: #FDE68A; border: 1px solid #64748B; }
    .ig-cap-box { width: 100%; min-height: 215px; background: #0F172A; color: #F8FAFC; border: 1.5px solid #F472B6; border-radius: 12px; padding: 13px; font-size: 13.5px; line-height: 1.6; font-family: inherit; resize: vertical; }
    .ig-meta-strip { margin-top: 12px; background: #0F172A; border: 1px solid #334155; border-radius: 12px; padding: 11px 13px; font-size: 12.5px; color: #CBD5E1; display: grid; gap: 5px; }
    .ig-meta-strip code { background: #1E293B; color: #F9A8D4; padding: 2px 6px; border-radius: 5px; font-weight: 700; }

    /* Naver Clip Section */
    .nc-section { background: linear-gradient(155deg, #07221B 0%, #111827 100%); border: 2px solid #12FA7A; border-radius: 18px; padding: 18px; margin-bottom: 18px; box-shadow: 0 10px 28px rgba(18,250,122,0.1); }
    .nc-head h2 { margin: 0 0 4px; font-size: 19px; color: #12FA7A; }
    .nc-sub { font-size: 12.5px; color: #94A3B8; margin-bottom: 12px; }
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 760px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card { background: #0F172A; border: 1px solid #1E293B; border-radius: 12px; padding: 10px 12px; }
    .kpi-card .k-lbl { font-size: 11.5px; color: #94A3B8; display: block; }
    .kpi-card .k-val { font-size: 18px; font-weight: 800; color: #F8FAFC; margin-top: 2px; }
    .kpi-card .k-val.green { color: #12FA7A; }
    .kpi-card .k-val.yellow { color: #FDE047; }

    .pinned-banner { background: linear-gradient(135deg, #271A05 0%, #1E293B 100%); border: 2px solid #FACC15; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
    .pinned-banner h3 { margin: 0 0 5px; font-size: 15.5px; color: #FDE047; }
    .pinned-sub { font-size: 12px; color: #FEF08A; margin-bottom: 9px; }
    .pinned-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
    .pinned-box { flex: 1 1 300px; background: #0F172A; color: #FFFFFF; border: 1.5px solid #FACC15; border-radius: 10px; padding: 10px 13px; font-size: 14px; font-weight: 800; user-select: all; -webkit-user-select: all; }

    .cap-panel { background: #0F172A; border: 1px solid #334155; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
    .cap-panel h3 { margin: 0 0 6px; font-size: 15.5px; color: #E9F708; }
    .cap-box { width: 100%; min-height: 150px; background: #0B1120; color: #F8FAFC; border: 1.5px solid #12FA7A; border-radius: 11px; padding: 11px; font-size: 13.5px; line-height: 1.55; font-family: inherit; resize: vertical; }

    .prod-card { background: #0F172A; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    .prod-card.rank-1 { border: 2.5px solid #12FA7A; }
    .card-top { display: grid; grid-template-columns: 115px 1fr; gap: 14px; align-items: start; }
    @media (max-width: 640px) { .card-top { grid-template-columns: 1fr; } .thumb { width: 105px !important; height: 105px !important; } }
    .thumb { width: 115px; height: 115px; object-fit: cover; border-radius: 12px; border: 1px solid #334155; background: #1E293B; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .badge { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 99px; }
    .b-rk1 { background: #12FA7A; color: #052E16; }
    .b-rk { background: #334155; color: #F8FAFC; }
    .b-bs { background: #065F46; color: #A7F3D0; border: 1px solid #10B981; }
    .b-ss { background: #1E293B; color: #E2E8F0; border: 1px solid #475569; }
    .b-rev { background: #422006; color: #FDE68A; border: 1px solid #D97706; }
    .prod-title { margin: 0 0 5px; font-size: 16.5px; color: #FFFFFF; word-break: keep-all; }
    .store-line { font-size: 12.5px; color: #94A3B8; margin-bottom: 9px; }
    .store-line code { background: #1E293B; color: #38BDF8; padding: 2px 6px; border-radius: 5px; }
    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0B1120; border: 1px solid #1E293B; border-radius: 10px; padding: 9px 11px; }
    @media (max-width: 680px) { .price-grid { grid-template-columns: 1fr; } }
    .price-grid .lbl { font-size: 11px; color: #94A3B8; display: block; }
    .val-p { font-size: 16.5px; font-weight: 800; }
    .val-pay { font-size: 18px; font-weight: 900; color: #12FA7A; }
    .pct-inp { width: 74px; background: #1E293B; color: #FDE047; border: 1.5px solid #475569; border-radius: 8px; padding: 4px 7px; font-size: 14.5px; font-weight: 800; }

    .action-row { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 8px; }
    button.act-btn, a.act-link { cursor: pointer; border: none; border-radius: 11px; padding: 11px 14px; font-size: 13.5px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: transform 0.08s ease, background-color 0.15s ease; }
    button.act-btn:active { transform: scale(0.97); }
    .btn-ig { background: linear-gradient(135deg, #F472B6 0%, #EC4899 100%); color: #3B0764; font-weight: 900; font-size: 15px; padding: 13px 20px; }
    .btn-pin { background: #FACC15; color: #1E1B04; font-weight: 900; font-size: 14px; padding: 11px 17px; }
    .btn-pri { background: #12FA7A; color: #052E16; font-weight: 900; }
    .btn-sec { background: #1E293B; color: #F8FAFC; border: 1px solid #475569; }
    .btn-lnk { background: #2563EB; color: #FFFFFF; }
    .copied-ok { background: #10B981 !important; color: #052E16 !important; border-color: #34D399 !important; }
    .toast { display: none; position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92vw; background: #10B981; color: #052E16; font-weight: 900; font-size: 14px; padding: 12px 18px; border-radius: 12px; box-shadow: 0 12px 28px rgba(0,0,0,0.55); z-index: 9999; text-align: center; word-break: keep-all; }
  </style>
</head>
<body>
  <!-- PIN Lock View -->
  <div id="auth-view" class="auth-wrap">
    <div id="auth-card" class="auth-card">
      <div class="auth-icon">🔐</div>
      <h1>인스타 6채널 + 네이버클립 통합 보드</h1>
      <div class="auth-sub">릴스 캡션 · 쿠팡스토어 · 클립 TOP 5 · 고정댓글 원클릭 복사<br/>보안 비밀번호를 입력해 주세요</div>
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••" />
      <label class="remember-row">
        <input type="checkbox" id="chk-remember" checked />
        <span>이 스마트폰/브라우저에서 로그인 유지</span>
      </label>
      <div class="keypad">
        <button type="button" class="kp-btn" data-k="1">1</button>
        <button type="button" class="kp-btn" data-k="2">2</button>
        <button type="button" class="kp-btn" data-k="3">3</button>
        <button type="button" class="kp-btn" data-k="4">4</button>
        <button type="button" class="kp-btn" data-k="5">5</button>
        <button type="button" class="kp-btn" data-k="6">6</button>
        <button type="button" class="kp-btn" data-k="7">7</button>
        <button type="button" class="kp-btn" data-k="8">8</button>
        <button type="button" class="kp-btn" data-k="9">9</button>
        <button type="button" class="kp-btn" data-k="back">⌫</button>
        <button type="button" class="kp-btn" data-k="0">0</button>
        <button type="button" id="btn-pin-submit" class="kp-btn kp-ok" data-k="ok">잠금해제</button>
      </div>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <!-- Unlocked App View -->
  <div id="app-view">
    <header class="topbar">
      <div>
        <div class="topbar-title">🚀 인스타 6채널 + 네이버클립 올인원 원클릭 보드</div>
        <div id="topbar-meta" class="topbar-meta"></div>
      </div>
      <button type="button" id="btn-lock-now" class="btn-lock">🔒 잠금</button>
    </header>

    <section class="filter-bar">
      <span class="filter-lbl">📱 채널별 빠른 필터 (업로드할 계정을 터치하세요):</span>
      <div id="ch-chips" class="ch-chips"></div>
    </section>

    <section class="ep-bar">
      <div class="ep-bar-head">
        <select id="ep-select" class="ep-select"></select>
        <div class="view-tabs" id="view-tabs">
          <button type="button" class="v-tab active" data-v="both">⚡ 인스타+클립 통합</button>
          <button type="button" class="v-tab" data-v="ig">📸 인스타만</button>
          <button type="button" class="v-tab" data-v="nc">🎬 네이버클립만</button>
        </div>
      </div>
      <div id="ep-pills" class="ep-pills"></div>
    </section>

    <!-- [1] Instagram Reels Section -->
    <section id="ig-panel" class="ig-section">
      <div class="ig-head">
        <h2 id="ig-title"></h2>
        <div id="ig-ext-links" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      </div>
      <div id="ig-badges" class="ig-badges"></div>
      <textarea id="ig-caption-ta" class="ig-cap-box" readonly></textarea>
      <div class="action-row">
        <button type="button" id="btn-ig-copy-caption" class="act-btn btn-ig">📋 인스타 본문 캡션 전체 원클릭 복사</button>
        <button type="button" id="btn-ig-copy-kw" class="act-btn btn-sec">🔑 댓글 키워드 복사</button>
        <button type="button" id="btn-ig-copy-store-item-url" class="act-btn btn-pri">🔗 스토어 단독상품링크 복사</button>
        <button type="button" id="btn-ig-copy-store-title" class="act-btn btn-sec">🏷️ 쿠팡 스토어용 상품명 복사</button>
        <button type="button" id="btn-ig-copy-deeplink" class="act-btn btn-sec">🔗 쿠팡 파트너스 링크 복사</button>
        <button type="button" id="btn-ig-copy-pid" class="act-btn btn-sec">🔢 쿠팡 PID 복사</button>
      </div>
      <div id="ig-meta-strip" class="ig-meta-strip"></div>
    </section>

    <!-- [2] Naver Clip 1+1 Section -->
    <section id="nc-panel" class="nc-section">
      <div class="nc-head">
        <h2 id="nc-title"></h2>
        <div id="nc-sub" class="nc-sub"></div>
      </div>
      <div id="nc-kpi-wrap"></div>

      <div class="pinned-banner">
        <h3>📌 [필수] 네이버클립 고정댓글 원클릭 복사 (업로드 직후 첫 댓글 작성 → '댓글 고정'!)</h3>
        <div class="pinned-sub">클립 등록 즉시 댓글창에 아래 문구를 첫 댓글로 남기고 <strong>[댓글 고정]</strong>을 눌러주세요.</div>
        <div class="pinned-row">
          <div id="pinned-text-box" class="pinned-box"></div>
          <button type="button" id="btn-web-copy-pinned" class="act-btn btn-pin">📌 고정댓글 원클릭 복사</button>
        </div>
      </div>

      <div class="cap-panel">
        <h3>📋 네이버클립 4단 본문 캡션 원클릭 복사 (본문 설명란 전용)</h3>
        <div style="font-size:12.5px;color:#94A3B8;margin-bottom:8px;">연동 상태: <strong id="web-selected-prod" style="color:#12FA7A;"></strong></div>
        <textarea id="web-caption-ta" class="cap-box" readonly></textarea>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <button type="button" id="btn-web-copy-caption" class="act-btn btn-pri">📋 클립 4단 본문 캡션 전체 복사</button>
          <button type="button" id="btn-web-copy-title" class="act-btn btn-sec">📋 클립 추천 제목 복사</button>
        </div>
      </div>

      <h3 id="cards-heading" style="font-size:17.5px;margin:0 0 12px;color:#F8FAFC;"></h3>
      <div id="cards-container"></div>
    </section>
  </div>

    function b64ToBytes(b64) {
      var bin = atob(b64);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }
    function bytesToB64(bytes) {
      var bin = '';
      var u8 = new Uint8Array(bytes);
      for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
      return btoa(bin);
    }
    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      if (window.__tTimer) clearTimeout(window.__tTimer);
      window.__tTimer = setTimeout(function() { t.style.display = 'none'; }, 2200);
    }

    function flashBtn(btn) {

      btn.classList.add('copied-ok');
      btn.textContent = '✅ 복사 완료!';
      if (btn.__rTimer) clearTimeout(btn.__rTimer);
      btn.__rTimer = setTimeout(function() {
        btn.classList.remove('copied-ok');
        var o = btn.getAttribute('data-orig');
        if (o) btn.textContent = o;
      }, 1700);
    }

    function copyNow(text, btnEl, label) {
      var str = String(text == null ? '' : text);
      if (!str) {
        showToast('복사할 항목이 비어 있습니다.');
        return;
      }
      var syncOk = false;
      var ta = null;
      try {
        ta = document.createElement('textarea');
        ta.value = str;
        ta.contentEditable = 'true';
        ta.readOnly = false;
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.width = '2em';
        ta.style.height = '2em';
        ta.style.opacity = '0.01';
        ta.style.zIndex = '-1';
        ta.style.fontSize = '16px';
        document.body.appendChild(ta);
        ta.focus({ preventScroll: true });
        ta.select();
        ta.setSelectionRange(0, str.length);
        syncOk = Boolean(document.execCommand('copy'));
      } catch (_) {
        syncOk = false;
      } finally {
        if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
      }

      if (navigator.clipboard && window.isSecureContext && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(str).then(function() {
          window.__lastCopiedText = str;
          window.__copyCount = (window.__copyCount || 0) + 1;
          flashBtn(btnEl);
          showToast('✅ ' + label + ' 복사 완료!');
        }).catch(function() {
          if (syncOk) {
            window.__lastCopiedText = str;
            window.__copyCount = (window.__copyCount || 0) + 1;
            flashBtn(btnEl);
            showToast('✅ ' + label + ' 복사 완료!');
          }
        });
        return;
      }
      if (syncOk) {
        window.__lastCopiedText = str;
        window.__copyCount = (window.__copyCount || 0) + 1;
        flashBtn(btnEl);
        showToast('✅ ' + label + ' 복사 완료!');
      }
    }

    function getLockRemainingMs() {
      var until = Number(localStorage.getItem(STORAGE_LOCK_UNTIL) || '0');
      var rem = until - Date.now();
      return rem > 0 ? rem : 0;
    }

    function setAuthControlsDisabled(disabled) {
      document.getElementById('pin-input').disabled = disabled;
      var btns = document.querySelectorAll('.kp-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = disabled;
    }

    function formatMmSs(ms) {
      var totalSec = Math.max(0, Math.ceil(ms / 1000));
      var mm = Math.floor(totalSec / 60);
      var ss = totalSec % 60;
      return (mm < 10 ? '0' + mm : String(mm)) + ':' + (ss < 10 ? '0' + ss : String(ss));
    }

    function refreshLockoutUi() {
      var rem = getLockRemainingMs();
      var msgEl = document.getElementById('auth-msg');
      if (rem > 0) {
        setAuthControlsDisabled(true);
        msgEl.className = 'auth-msg locked';
        msgEl.textContent = '🔒 비밀번호 10회 오류로 30분간 입력이 제한됩니다. (남은 시간 ' + formatMmSs(rem) + ')';
        if (!LOCK_TIMER_ID) LOCK_TIMER_ID = setInterval(refreshLockoutUi, 1000);
        return true;
      }
      if (LOCK_TIMER_ID) {
        clearInterval(LOCK_TIMER_ID);
        LOCK_TIMER_ID = null;
        localStorage.removeItem(STORAGE_LOCK_UNTIL);
        localStorage.setItem(STORAGE_FAIL_CNT, '0');
        setAuthControlsDisabled(false);
        msgEl.className = 'auth-msg';
        msgEl.textContent = '잠금이 해제되었습니다. 비밀번호를 입력해 주세요.';
      }
      return false;
    }

    async function deriveAesKeyFromPin(pinStr, extractable) {
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(pinStr), { name: 'PBKDF2' }, false, ['deriveKey', 'deriveBits']);
      return await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: b64ToBytes(ENCRYPTED_ENVELOPE.salt_b64),
          iterations: ENCRYPTED_ENVELOPE.iterations,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        Boolean(extractable),
        ['decrypt']
      );
    }

    async function decryptEnvelopeWithKey(aesKey) {
      var plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(ENCRYPTED_ENVELOPE.iv_b64) },
        aesKey,
        b64ToBytes(ENCRYPTED_ENVELOPE.ciphertext_b64)
      );
      return JSON.parse(new TextDecoder('utf-8').decode(plainBuf));
    }

    async function submitPin() {
      if (refreshLockoutUi()) return;
      var inp = document.getElementById('pin-input');
      var pin = (inp.value || '').trim();
      var msgEl = document.getElementById('auth-msg');
      if (!pin) {
        msgEl.className = 'auth-msg';
        msgEl.textContent = '비밀번호를 입력해 주세요.';
        return;
      }
      setAuthControlsDisabled(true);
      try {
        var remember = document.getElementById('chk-remember').checked;
        var key = await deriveAesKeyFromPin(pin, remember);
        var data = await decryptEnvelopeWithKey(key);
        localStorage.setItem(STORAGE_FAIL_CNT, '0');
        localStorage.removeItem(STORAGE_LOCK_UNTIL);
        if (remember) {
          var rawKey = await crypto.subtle.exportKey('raw', key);
          localStorage.setItem(STORAGE_DERIVED_KEY, bytesToB64(rawKey));
        } else {
          localStorage.removeItem(STORAGE_DERIVED_KEY);
        }
        inp.value = '';
        enterUnlockedApp(data);
      } catch (err) {
        var fails = Number(localStorage.getItem(STORAGE_FAIL_CNT) || '0') + 1;
        localStorage.setItem(STORAGE_FAIL_CNT, String(fails));
        inp.value = '';
        var card = document.getElementById('auth-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');

        if (fails >= MAX_FAIL_ATTEMPTS) {
          localStorage.setItem(STORAGE_LOCK_UNTIL, String(Date.now() + LOCKOUT_DURATION_MS));
          refreshLockoutUi();
        } else {
          setAuthControlsDisabled(false);
          msgEl.className = 'auth-msg';
          msgEl.textContent = '❌ 비밀번호가 올바르지 않습니다. (' + fails + ' / ' + MAX_FAIL_ATTEMPTS + '회 실패 — 10회 오류 시 30분간 잠금)';
          inp.focus();
        }
      }
    }

      var allEps = APP_DATA.episodes || [];

      }

    function applyHashRouting() {
      if (!APP_DATA) return;
      var raw = decodeURIComponent((location.hash || '').replace(/^#/, '').replace(/^ep=/i, '')).trim();
      if (!raw) {
        applyFilterAndRebuildList('');
        return;
      }
      if (/^ch[1-6]$/i.test(raw)) {
        FILTER_MODE = raw.toLowerCase();
        applyFilterAndRebuildList('');
        return;
      }
      if (raw === 'nc') {
        FILTER_MODE = 'nc';
        VIEW_MODE = 'nc';
        applyFilterAndRebuildList('');
        return;
      }
      var viewOverride = '';
      if (raw.slice(-3) === '-ig') {
        viewOverride = 'ig';
        raw = raw.slice(0, -3);
      } else if (raw.slice(-3) === '-nc') {
        viewOverride = 'nc';
        raw = raw.slice(0, -3);
      }
      if (viewOverride) VIEW_MODE = viewOverride;
      FILTER_MODE = 'all';
      applyFilterAndRebuildList(raw);
    }

      APP_DATA = data;
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      document.getElementById('topbar-meta').textContent =
        '인스타 전 회차 ' + data.episodeCount + '편 + 네이버클립 ' + data.naverClipReadyCount + '편 통합 · 갱신: ' + data.updatedAtKst;
      buildFilterChips();
      applyHashRouting();
    }

    // Keypad & Auth bindings
    document.querySelector('.keypad').addEventListener('click', function(ev) {
      var b = ev.target.closest('.kp-btn');
      if (!b || b.disabled) return;
      var k = b.getAttribute('data-k');
      var inp = document.getElementById('pin-input');
      if (k === 'ok') submitPin();
      else if (k === 'back') inp.value = inp.value.slice(0, -1);
      else if (inp.value.length < 8) inp.value += k;
    });
    document.getElementById('pin-input').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') submitPin();
    });
    document.getElementById('btn-lock-now').addEventListener('click', function() {
      localStorage.removeItem(STORAGE_DERIVED_KEY);
      APP_DATA = null;
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'flex';
      setAuthControlsDisabled(false);
      document.getElementById('auth-msg').textContent = '안전하게 잠금 처리되었습니다.';
    });

    // Filter / Episode / View bindings
    document.getElementById('ch-chips').addEventListener('click', function(ev) {
      var chip = ev.target.closest('.ch-chip');
      if (!chip) return;
      FILTER_MODE = chip.getAttribute('data-f') || 'all';
      applyFilterAndRebuildList('');
    });
    document.getElementById('view-tabs').addEventListener('click', function(ev) {
      var vt = ev.target.closest('.v-tab');
      if (!vt) return;
      VIEW_MODE = vt.getAttribute('data-v') || 'both';
      renderSelectedEpisode();
    });
    document.getElementById('ep-select').addEventListener('change', function(ev) {
      var no = ev.target.value;
      for (var i = 0; i < FILTERED_EPS.length; i++) {
        if (FILTERED_EPS[i].episodeNo === no) {
          CURRENT_EP = FILTERED_EPS[i];
          renderSelectedEpisode();
          break;
        }
      }
    });
    document.getElementById('ep-pills').addEventListener('click', function(ev) {
      var p = ev.target.closest('.ep-pill');
      if (!p) return;
      var no = p.getAttribute('data-epno');
      for (var i = 0; i < FILTERED_EPS.length; i++) {
        if (FILTERED_EPS[i].episodeNo === no) {
          CURRENT_EP = FILTERED_EPS[i];
          renderSelectedEpisode();
          break;
        }
      }
    });
    window.addEventListener('hashchange', function() {
      if (APP_DATA) applyHashRouting();
    });

    // Instagram Copy Buttons
    document.getElementById('btn-ig-copy-caption').addEventListener('click', function() {
      var v = document.getElementById('ig-caption-ta').value;
      copyNow(v, this, '인스타 본문 캡션 전체');
    });
    document.getElementById('btn-ig-copy-kw').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.insta.ctaCommentKeyword, this, '인스타 댓글 키워드');
    });
    document.getElementById('btn-ig-copy-store-item-url').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.insta.coupangInfluencerProductUrl, this, '쿠팡 스토어 단독상품링크');
    });
    document.getElementById('btn-ig-copy-store-title').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.insta.storeProductTitle, this, '쿠팡 스토어 상품명');
    });
    document.getElementById('btn-ig-copy-deeplink').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.insta.coupangShortenUrl || CURRENT_EP.insta.coupangProductUrl, this, '쿠팡 파트너스 딥링크');
    });
    document.getElementById('btn-ig-copy-pid').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.insta.coupangPid, this, '쿠팡 상품 PID');
    });

    // Naver Clip Copy Buttons
    document.getElementById('btn-web-copy-pinned').addEventListener('click', function() {
      if (!APP_DATA) return;
      copyNow(APP_DATA.pinnedComment, this, '필수 고정댓글');
    });
    document.getElementById('btn-web-copy-caption').addEventListener('click', function() {
      var v = document.getElementById('web-caption-ta').value;
      copyNow(v, this, '클립 4단 본문 캡션');
    });
    document.getElementById('btn-web-copy-title').addEventListener('click', function() {
      if (!CURRENT_EP) return;
      copyNow(CURRENT_EP.clipTitle, this, '클립 추천 제목');
    });
    document.getElementById('cards-container').addEventListener('click', function(ev) {
      var btn = ev.target.closest('button[data-act]');
      if (!btn || !CURRENT_EP) return;
      var idx = Number(btn.getAttribute('data-idx') || 0);
      var card = CURRENT_EP.cards && CURRENT_EP.cards[idx];
      if (!card) return;
      var act = btn.getAttribute('data-act');
      if (act === 'cap') {
        document.getElementById('web-caption-ta').value = card.readyCaption;
        document.getElementById('web-selected-prod').textContent = '#' + card.rank + ' ' + card.productName;
        copyNow(card.readyCaption, btn, '#' + card.rank + ' 맞춤 캡션');
      } else if (act === 'name') {
        copyNow(card.productName, btn, '#' + card.rank + ' 상품명');
      } else if (act === 'cno') {
        copyNow(card.channelProductNo || card.affiliateProductId, btn, '#' + card.rank + ' 상품번호');
      } else if (act === 'url') {
        copyNow(card.affiliateUrl, btn, '#' + card.rank + ' 상품링크');
      }
    });

    (async function initBoot() {
      if (refreshLockoutUi()) return;
      var savedDk = localStorage.getItem(STORAGE_DERIVED_KEY);
      if (savedDk) {
        try {
          var k = await crypto.subtle.importKey('raw', b64ToBytes(savedDk), { name: 'AES-GCM' }, false, ['decrypt']);
          var d = await decryptEnvelopeWithKey(k);
          enterUnlockedApp(d);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_DERIVED_KEY);
        }
      }
      document.getElementById('pin-input').focus();
    })();
  </script>
</body>
</html>
